<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City of Shadows</title>
    <style>
        /* Styling that matches the cyberpunk, neon-night vibe of the image */
        body {
            font-family: 'Courier New', Courier, monospace; /* Techy, hacker-style font */
            background-color: #0a0a0c; /* Deep dark background to match the night sky */
            color: #e0e0e0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            background-color: #121215;
            border-radius: 8px;
            border: 1px solid #333;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 75, 43, 0.15); /* Subtle red neon glow */
            text-align: left;
        }

        .hero-image {
            width: 100%;
            height: auto;
            display: block;
            border-bottom: 2px solid #ff4b2b; /* Red line tying into the hoodie */
        }

        .content {
            padding: 35px;
        }

        h1 {
            font-size: 2.2rem;
            margin-top: 0;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 75, 43, 0.5); /* Neon text glow */
        }

        p {
            font-size: 1.1rem;
            color: #a0a0a0;
            line-height: 1.7;
            margin-bottom: 0;
        }
        
        .tag {
            display: inline-block;
            background-color: transparent;
            color: #ff4b2b;
            border: 1px solid #ff4b2b;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- The Image -->
        <img src="hoodie-boy.jpg" alt="A mysterious figure in a red hoodie looking over a neon-lit city at night" class="hero-image">
        
        <!-- The Text Content -->
        <div class="content">
            <span class="tag">Anonymity in the Neon Dark Space</span>
            <h1>The Watcher in the Dark</h1>
            <p>High above the glowing streets, the city hums with secrets. Hidden behind the shadows of the crimson hood, they watch the lights flicker in the concrete jungle.</p>
        </div>
    </div>

</body>
</html>
